# cargo-deny configuration: advisories, licenses, and duplicate/source
# hygiene for the whole workspace. Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
# Any RUSTSEC advisory (vulnerability, unmaintained, unsound, notice)
# fails CI; exceptions must be listed here with a reason.
version = 2
yanked = "deny"

[licenses]
version = 2
# Everything in the tree is permissive. The workspace's own crates are
# MIT OR Apache-2.0; webpki-roots carries CDLA-Permissive-2.0 (the
# Mozilla root store data license).
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
