name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here comments, tags, releases, or writes to the repository, so
# no job needs more than read. Without this, jobs inherit the repository
# default — which is write, and which would let a compromised action push
# to main or approve a pull request, i.e. reach a future `cargo publish`.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Actions are pinned by commit SHA, not by tag. `@v7` and `@stable` are
# mutable refs the action's owner can repoint at any time, so a tag pin
# trusts that repository forever; a SHA pin trusts exactly the code that
# was reviewed. The trailing comment records the human-readable ref each
# SHA was resolved from.

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: cargo fmt --check
      # --locked throughout: without it CI silently resolves newer
      # semver-compatible dependencies than the reviewed lockfile, so a
      # freshly published malicious patch release would run here with no
      # lockfile change to review.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: docs build warning-free
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: docs build warning-free without the kafka feature too
        # A doc link to a cfg'd-out item is an error only in the
        # configuration that omits it, so the default-feature run above
        # cannot see those. This one caught three.
        run: cargo doc -p odradek-web-core --no-deps --no-default-features --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - name: hardware-accelerated crc is bit-identical
        run: cargo test -p odradek-protocol --features hardware-crc --locked
      - name: lean client builds (no tls/sasl/codecs)
        run: cargo check -p odradek-client --no-default-features --locked
      - name: lean acceptance build (no tls)
        # The suite's checks need no TLS stack; only being pointed at a
        # broker that demands one does. A consumer taking the catalogue
        # and the report types should not acquire rustls with them, and
        # the cfgs that make that true are only compiled in this
        # configuration.
        run: cargo check -p odradek-acceptance --no-default-features --locked
      - name: lean web transports build (no kafka)
        run: cargo check -p odradek-web-sse -p odradek-web-ws --no-default-features --locked
      - name: generated code is in sync with the schemas
        # codegen output is committed formatted, so format before diffing
        run: cargo xtask codegen && cargo fmt && git diff --exit-code
      - name: crates package and build from the packaged tarball
        # Without --no-verify, cargo unpacks each tarball and compiles it
        # against the others as registry dependencies. That is the only
        # check that catches a crate which builds here but not from what
        # is actually uploaded -- a file outside the crate directory, a
        # path dependency with no version. Publishing is irreversible and
        # ordered, so the failure this prevents is three crates live on
        # crates.io and the fourth refusing to build. ~35s.
        run: cargo package --workspace --locked

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: workspace compiles on the declared rust-version
        run: cargo check --workspace --all-targets --locked

  crc-aarch64:
    name: hardware crc (aarch64)
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The crc32c crate dispatches at runtime, so the x86-64 leg only
      # ever exercises SSE4.2. Two odradek nodes whose CRCs disagreed
      # would silently reject each other's every batch, so the
      # bit-identical claim needs the other architecture too.
      - name: crc is bit-identical on CRC32CX as well
        run: cargo test -p odradek-protocol --features hardware-crc --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check

  client-matrix:
    name: client matrix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: enforce committed baselines against a real client
        # The other direction from the conformance job: there real
        # brokers answer our checks, here a real client is answered by
        # our harness and judged on what it says. Two subjects — kcat
        # from its image, and odradek-client as a cargo example — six
        # scenarios each: a producer, a consumer, and one per injected
        # fault, because five of the eleven client checks have nothing
        # to judge until a fault is armed, and a matrix that ran the
        # happy path alone would leave half the catalogue skipping and
        # call it a pass.
        #
        # Our own client is a subject here, not the harness's
        # implementation: it arrives over a socket like kcat does, and
        # its first run found a check that had been passing both of them
        # without having been answered by either.
        #
        # Its own job rather than a step of the conformance one: it
        # needs no broker, finishes in well under a minute, and a
        # failure here means something different.
        run: |
          docker pull -q edenhill/kcat:1.7.1 &
          cargo xtask client-matrix
          wait || true

  conformance:
    name: real-broker conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: enforce committed baselines against Kafka and Redpanda, single and clustered
        # Seven subjects: each implementation as one broker and as a
        # three-node cluster, plus a Redpanda that authenticates every
        # connection, a Kafka 3.7 for the api versions 4.x no longer
        # accepts, and a Kafka behind TLS — whose certificates are
        # generated per run with openssl, so nothing here expires.
        #
        # The plaintext single-node ones run twice — once against the
        # broker, once through examples/proxy.rs, both enforced against
        # the same baseline — which is what keeps the protocol crate's
        # proxy guarantee honest: a dropped tagged field or a re-encoded
        # batch makes some check answer differently than the broker
        # behind it.
        #
        # The xtask overlaps subjects by broker count rather than
        # running all eight at once, which on a two-core runner would
        # slow the brokers enough for the suite's waits to expire and
        # report the subject for it.
        #
        # ~1.3GB of images, otherwise pulled implicitly by the first
        # `docker run` — that is, only once the build is over. Start the
        # pulls first so they overlap the compile. Nothing here depends on
        # them succeeding: `docker run` pulls whatever is missing anyway.
        run: |
          docker pull -q apache/kafka:4.1.0 &
          docker pull -q apache/kafka:3.7.0 &
          docker pull -q redpandadata/redpanda:v25.2.1 &
          cargo xtask conformance
          wait || true
