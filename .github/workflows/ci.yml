name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: docs build warning-free
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - name: hardware-accelerated crc is bit-identical
        run: cargo test -p odradek-protocol --features hardware-crc
      - name: lean client builds (no tls/sasl/codecs)
        run: cargo check -p odradek-client --no-default-features
      - name: lean web transports build (no kafka)
        run: cargo check -p odradek-web-sse -p odradek-web-ws --no-default-features
      - name: generated code is in sync with the schemas
        # codegen output is committed formatted, so format before diffing
        run: cargo xtask codegen && cargo fmt && git diff --exit-code
      - name: crates package cleanly
        run: cargo package --workspace --no-verify

  msrv:
    name: MSRV (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: workspace compiles on the declared rust-version
        run: cargo check --workspace --all-targets --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  conformance:
    name: real-broker conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: enforce committed baselines against Kafka and Redpanda
        # ~850MB of images, otherwise pulled implicitly by the first
        # `docker run` — that is, only once the build is over. Start both
        # pulls first so they overlap the compile. Nothing here depends on
        # them succeeding: `docker run` pulls whatever is missing anyway.
        run: |
          docker pull -q apache/kafka:4.1.0 &
          docker pull -q redpandadata/redpanda:v25.2.1 &
          cargo xtask conformance
          wait || true
