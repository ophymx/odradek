[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Jeffrey T. Peckham <abic@ophymx.com>"]
repository = "https://github.com/ophymx/odradek"

[workspace.dependencies]
# internal crates
odradek-protocol = { path = "crates/odradek-protocol", version = "0.1.0" }
odradek-client = { path = "crates/odradek-client", version = "0.1.0" }
odradek-web-core = { path = "crates/odradek-web-core", version = "0.1.0" }

# external
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
bytes = "1"
crc32c = "0.6"
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
flate2 = "1"
getrandom = "0.3"
hmac = "0.12"
lz4_flex = "0.11"
pbkdf2 = { version = "0.12", default-features = false }
sha2 = "0.10"
snap = "1"
subtle = { version = "2.6", default-features = false }
rustls-pki-types = "1"
tokio-rustls = "0.26"
webpki-roots = "1"
tokio-stream = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "rt-multi-thread", "sync", "time", "macros"] }
tracing = "0.1"
zstd = "0.13"

[workspace.lints.rust]
missing_debug_implementations = "warn"

[workspace.lints.clippy]
cast_possible_truncation = "warn"
