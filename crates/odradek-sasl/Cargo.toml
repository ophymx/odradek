[package]
name = "odradek-sasl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
description = "Sans-I/O SASL mechanisms for the odradek Kafka crates: SCRAM-SHA-256/512 and PLAIN, both client and server roles."
keywords = ["sasl", "scram", "kafka", "authentication", "sans-io"]
categories = ["authentication", "network-programming"]

[features]
default = []
## AWS_MSK_IAM: SigV4 signing for Amazon MSK. Off by default — it is the
## only mechanism here needing a JSON encoder, and a security crate's
## default dependency tree is worth keeping short.
aws-msk-iam = ["dep:serde_json"]

[dependencies]
base64 = { workspace = true }
getrandom = { workspace = true }
hmac = { workspace = true }
pbkdf2 = { workspace = true }
serde_json = { workspace = true, optional = true }
sha2 = { workspace = true }
stringprep = { workspace = true }
subtle = { workspace = true }
zeroize = { workspace = true, features = ["derive"] }

[dev-dependencies]
base64 = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
