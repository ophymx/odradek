[package]
name = "odradek-acceptance"
description = "Acceptance suite for the Kafka protocol: validates server and client implementations for wire-level conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["kafka", "protocol", "conformance", "testing"]
categories = ["development-tools::testing", "network-programming"]

[dependencies]
odradek-protocol = { workspace = true }
odradek-sasl = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
# The four codecs a Kafka record set may be compressed with, for the
# checks that produce one. Codec crates, not a client: the rule this
# crate keeps is that it never uses odradek-client to validate
# odradek-client, so the framing each codec needs is written out here
# from the protocol rather than borrowed from the implementation under
# test.
flate2 = { workspace = true }
lz4_flex = { workspace = true }
snap = { workspace = true }
zstd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
# Only for tests: the suite itself must stay independent of the client so
# it can credibly validate it.
odradek-client = { workspace = true }

[lints]
workspace = true
