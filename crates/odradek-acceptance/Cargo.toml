[package]
name = "odradek-acceptance"
description = "Acceptance suite for the Kafka protocol: validates server and client implementations for wire-level conformance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["kafka", "protocol", "conformance", "testing"]
categories = ["development-tools::testing", "network-programming"]

[dependencies]
odradek-protocol = { workspace = true }
odradek-sasl = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

[dev-dependencies]
