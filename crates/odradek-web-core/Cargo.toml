[package]
name = "odradek-web-core"
description = "Transport-agnostic bridge from Kafka partitions to web-shaped subscribers: fan-out, replay from offsets, filtering, self-healing backpressure"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["kafka", "streaming", "bridge", "fan-out", "backpressure"]
categories = ["network-programming", "asynchronous", "web-programming"]

[features]
default = ["kafka"]
## The real-cluster source ([`KafkaSource`]); without it the engine
## still builds against any [`RecordSource`].
kafka = ["dep:odradek-client"]

[dependencies]
odradek-client = { workspace = true, optional = true }
base64 = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[example]]
name = "tail"
required-features = ["kafka"]

[[bench]]
name = "fanout"
harness = false

[lints]
workspace = true
