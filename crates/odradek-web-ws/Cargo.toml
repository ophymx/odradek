[package]
name = "odradek-web-ws"
description = "WebSocket transport over odradek-web-core: an embeddable axum router streaming Kafka partitions as JSON text frames, offset-resumable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["kafka", "websocket", "axum", "streaming"]
categories = ["web-programming::websocket", "network-programming", "asynchronous"]

[features]
default = ["kafka"]
## Pass-through to odradek-web-core's real-cluster source.
kafka = ["odradek-web-core/kafka"]

[dependencies]
# Not workspace-inherited: cargo cannot un-set default-features on an
# inherited dependency, and lean builds need it off.
odradek-web-core = { path = "../odradek-web-core", version = "0.1.0", default-features = false }
axum = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
odradek-client = { workspace = true }
odradek-web-sse = { path = "../odradek-web-sse", version = "0.1.0" }

[[example]]
name = "serve"
required-features = ["kafka"]

[lints]
workspace = true
